baseURL = "https://gjanas.com/"
theme = "beautifulhugo"
title = "Grzegorz Janas"
enableRobotsTXT = true
enableGitInfo = true

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# ptaki/CLAUDE.md to notatka developerska aplikacji — zostaje w repo, nie trafia na stronę.
# Własny mount zastępuje domyślny mount static/, więc musi go odtworzyć w całości.
[[module.mounts]]
  source = "static"
  target = "static"
  files = ["! ptaki/CLAUDE.md"]

# Nazwa katalogu wpisu (page bundle) = URL, wspólny dla EN i PL
[permalinks]
  [permalinks.page]
    blog = "/blog/:contentbasename/"

# Oryginały zdjęć z wpisów (z EXIF/GPS) nie są publikowane — tylko wersje
# przetworzone przez render hook (WebP) i obrazek podglądu (func/share-image.html)
[[cascade]]
  [cascade.build]
    publishResources = false
  [cascade.target]
    path = "{/blog/**}"

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"

[outputs]
  home = ["html", "rss", "json"]

# RSS pod /feed.xml (adres zwyczajowy z Jekylla) zamiast /index.xml
[outputFormats.rss]
  baseName = "feed"

[imaging]
  resampleFilter = "Lanczos"
  [imaging.jpeg]
    quality = 80
  [imaging.webp]
    quality = 80

# selfHosted pobiera Bootstrap/Font Awesome/fonty raz przy buildzie i trzyma je w cache
[caches.getresource]
  dir = ":cacheDir/:project"
  maxAge = -1

[markup.goldmark.renderer]
  unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[markup.highlight]
  codeFences = true
  noClasses = false

[Params]
  # 200 px WebP; stary /assets/img/avatar-icon.png (1 MB) zostaje tylko dla starych linków
  logo = "/img/gjanas-avatar.webp"
  # Domyślny obrazek podglądu linku (1200x630); wpis może ustawić własny przez `cover:`
  share_img = "/img/og-default.jpg"
  favicon = "/favicon.ico"
  colorScheme = "auto"
  mathEngine = "none"
  selfHosted = true
  rss = true
  readingTime = true
  # Jedyny autor — bez imienia przy każdym wpisie
  hideAuthor = true
  showRelatedPosts = true
  mainSections = ["blog"]

  [Params.author]
    name = "Grzegorz Janas"
    email = "grzegorz.janas@outlook.com"
    facebook = "grzesiek.tzw"
    github = "gjanas"
    twitter = "g_janas"
    youtube = "@gjanas"
    reddit = "gjanas"
    linkedin = "janasgrzegorz"
    steam = "gjanas"

[languages]
  [languages.en]
    label = "English"
    locale = "en"
    weight = 1
    [languages.en.params]
      description = "Grzegorz Janas – technology enthusiast, Apple fan, home automation, 3D printing and hydroponics. SysAdmin and DevOps."
      keywords = "Grzegorz Janas, gjanas, SysAdmin, DevOps, smart home, Home Assistant, hydroponics, 3D printing, Apple"
    [[languages.en.menus.main]]
      name = "Blog"
      pageRef = "/blog"
      weight = 1
    [[languages.en.menus.main]]
      name = "Links"
      pageRef = "/links"
      weight = 2
    [[languages.en.menus.main]]
      name = "About me"
      pageRef = "/about"
      weight = 3

  [languages.pl]
    label = "Polski"
    locale = "pl"
    weight = 2
    [languages.pl.params]
      description = "Grzegorz Janas - entuzjasta technologii, fan Apple, automatyki domowej, druku 3D i hydroponiki. SysAdmin i DevOps."
      keywords = "Grzegorz Janas, gjanas, SysAdmin, DevOps, smart home, Home Assistant, hydroponika, druk 3D, Apple"
    [[languages.pl.menus.main]]
      name = "Blog"
      pageRef = "/blog"
      weight = 1
    [[languages.pl.menus.main]]
      name = "Linki"
      pageRef = "/links"
      weight = 2
    [[languages.pl.menus.main]]
      name = "O mnie"
      pageRef = "/about"
      weight = 3
