name: Deploy Hugo site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  # Ten sam obraz co lokalnie (README) — przy aktualizacji zmień tag i digest w obu miejscach
  HUGO_IMAGE: ghcr.io/gohugoio/hugo:v0.168.0@sha256:1fb8fe7f417abd5802d86747d297728aa48078d763159e7dff6559fe3f8bb8e7

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # enableGitInfo potrzebuje pełnej historii (lastmod)
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: |
          docker run --rm \
            -u "$(id -u):$(id -g)" \
            -v "$PWD":/project -w /project \
            -e HUGO_CACHEDIR=/tmp/hugo_cache \
            -e HUGO_ENVIRONMENT=production \
            "$HUGO_IMAGE" \
            build --panicOnWarning --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
